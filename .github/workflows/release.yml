name: Release

# Runs when a version tag such as v0.1.0 or v0.1.0-preview.1 is pushed.
on:
  push:
    tags: ['v*']

# Trusted Publishing: the job proves its identity to nuget.org with a GitHub OIDC token and receives a short-lived API key.
# No API key secret is stored. Requires a Trusted Publishing policy on nuget.org for this repository and release.yml.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build AspGuard.slnx -c Release

      # The .NET Framework tests run on Windows only (CI's windows-latest job); here they build but are skipped.
      - name: Test
        run: dotnet test AspGuard.slnx -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/AspGuard.Core -c Release --no-build -o ./nupkg
          dotnet pack src/AspGuard -c Release --no-build -o ./nupkg
          dotnet pack src/AspGuard.EntityFramework6 -c Release --no-build -o ./nupkg
          dotnet pack src/AspGuard.SystemWeb -c Release --no-build -o ./nupkg

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./nupkg/*

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: tahaorhan13

      - name: Publish to NuGet
        run: dotnet nuget push "./nupkg/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
